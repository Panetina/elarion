# Match Lithium's effective dependency resolution explicitly. Block tracking is
# intentionally disabled, so its dependent collision/cache mixins must also be
# disabled instead of being rejected noisily during every server startup.
mixin.entity.collisions.fluid=false
mixin.experimental.entity.block_caching=false
mixin.experimental.entity.block_caching.block_support=false
mixin.experimental.entity.block_caching.block_touching=false
mixin.experimental.entity.block_caching.fluid_pushing=false
mixin.experimental.entity.block_caching.suffocation=false
