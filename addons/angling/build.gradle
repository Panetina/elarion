dependencies {
    implementation(project(path: ':platform:core', configuration: 'namedElements')) {
        exclude group: 'net.fabricmc.fabric-api'
    }

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
    from('LICENSE') {
        into 'META-INF'
    }
}

test {
    useJUnitPlatform()
}
