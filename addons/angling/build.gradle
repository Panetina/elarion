}

tasks.register('verifyAnglingPort') {
    group = 'verification'
    description = 'Runs the complete Angling parity gate; requires the authorized local reference checkout.'
    dependsOn tasks.named('verifyAnglingFoundation'), tasks.named('verifyAnglingPortInventory'),
            tasks.named('verifyAnglingTransformedData'), tasks.named('verifyAnglingPortAssets'),
            tasks.named('verifyAnglingNativeServerData'), tasks.named('verifyAnglingDomainMaps')
}

test {
    useJUnitPlatform()
}

// Recipe serializers and their Fabric parity are still part of Angling's release
// gate. Keep the foundation's authored recipe data in source for the authorized
// port, but never package any Angling recipe before that gate is complete.
processResources {
    exclude 'data/elarion_angling/recipe/**'
}
