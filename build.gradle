allprojects {
    group = project.maven_group
    version = project.mod_version + '+mc.' + project.jar_mc_version
}

def structuralProjects = [':platform', ':addons', ':tests', ':vendor']
def modProjects = subprojects.findAll { !structuralProjects.contains(it.path) }
def optionalAddonQa = providers.gradleProperty('optionalAddonQa')
        .map { it.toBoolean() }
        .orElse(false)
// Foundation-only ports build and test normally, but cannot enter canonical
// exports or live deployment until their release gates are implemented.
def foundationOnlyModPaths = [':addons:angling', ':addons:angling-delight'] as Set
def exportableModProjects = modProjects.findAll {
    (it.path == ':platform:core' || it.path.startsWith(':addons:'))
            && !foundationOnlyModPaths.contains(it.path)
} + modProjects.findAll { it.path == ':vendor:yyzsbackpack' }
def distributionManifestFile = layout.projectDirectory.file('distribution/mods.json').asFile
def distributionManifest = new groovy.json.JsonSlurper().parse(distributionManifestFile)
def distributionArtifacts = distributionManifest.artifacts as List<Map<String, Object>>
def distributionArtifactsByFilename = distributionArtifacts.collectEntries { [(it.filename): it] }
def bundledArtifactMetadata = [
        'yyzsbackpack-0.0.3-reborn+1.21.1.jar': [
                role: 'gameplay',
                source: 'https://github.com/yyz729/yyzsbackpack/tree/6f44d3372a25638a90c48e76751c7638e42a4d87',
                license: 'MIT'
        ]
]
def bundledRuntimeJarFiles = files(
        'vendor/yyzsbackpack/build/libs/yyzsbackpack-0.0.3-reborn+1.21.1.jar'
)
def artifactsForSide = { String side ->
    distributionArtifacts.findAll { it.side == side }
}
def resolvedThirdPartyJarNames = distributionArtifacts.findAll { it.projectId }.collectEntries {
    [("${it.projectId}-${it.versionId}.jar".toString()): it.filename]
}
def canonicalThirdPartyJarName = { String inputName ->
    def artifact = distributionArtifacts.find {
        inputName == it.filename || (it.projectId
                && inputName.contains(it.projectId.toString())
                && inputName.contains(it.versionId.toString()))
    }
    artifact?.filename ?: resolvedThirdPartyJarNames.getOrDefault(inputName, inputName)
}

def sha512 = { File source ->
    def digest = java.security.MessageDigest.getInstance('SHA-512')
    source.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def enableSharedResourcePacks = { File optionsFile, List<String> packNames ->
    if (packNames.isEmpty()) return
    def activeIds = packNames.collect { "file/${it}".toString() }.unique()
    def lines = optionsFile.isFile()
            ? optionsFile.readLines('UTF-8')
            : []
    def updated = []
    def activeWritten = false
    def incompatibleWritten = false
    lines.each { line ->
        if (line.startsWith('resourcePacks:')) {
            def current = new groovy.json.JsonSlurper().parseText(
                    line.substring('resourcePacks:'.length())) as List
            def retained = current.findAll { !activeIds.contains(it) }.unique()
            retained.addAll(activeIds)
            updated.add('resourcePacks:' + groovy.json.JsonOutput.toJson(retained))
            activeWritten = true
        } else if (line.startsWith('incompatibleResourcePacks:')) {
            def current = new groovy.json.JsonSlurper().parseText(
                    line.substring('incompatibleResourcePacks:'.length())) as List
            def retained = current.findAll { !activeIds.contains(it) }.unique()
            updated.add('incompatibleResourcePacks:' + groovy.json.JsonOutput.toJson(retained))
            incompatibleWritten = true
        } else {
            updated.add(line)
        }
    }
    if (!activeWritten) {
        updated.add('resourcePacks:' + groovy.json.JsonOutput.toJson(activeIds))
    }
    if (!incompatibleWritten) {
        updated.add('incompatibleResourcePacks:[]')
    }
    optionsFile.parentFile.mkdirs()
    optionsFile.setText(updated.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
}

def enforceDevOfflineAuthentication = { File serverProperties ->
    def source = serverProperties.isFile() ? serverProperties.getText('UTF-8') : ''
    def lines = source.indexOf('\u0000') >= 0
            ? ['# Rebuilt by Elarion local development synchronization.']
            : source.readLines()
    def updated = lines.findAll { line ->
        !line.startsWith('online-mode=') && !line.startsWith('enforce-secure-profile=')
    }
    updated.add('online-mode=false')
    updated.add('enforce-secure-profile=false')
    serverProperties.parentFile.mkdirs()
    serverProperties.setText(updated.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
}

configurations {
    distributionBoth
    distributionServer
    distributionClient
    distributionAdmin
}

dependencies {
    [both: 'distributionBoth', server: 'distributionServer',
     client: 'distributionClient', admin: 'distributionAdmin'].each { side, configurationName ->
        artifactsForSide(side).each { artifact ->
            def buildCoordinate = artifact.projectId
                    ? "modrinth.cdn:${artifact.projectId}:${artifact.versionId}:${artifact.filename}@jar"
                    : artifact.coordinate
            add(configurationName, buildCoordinate) {
                transitive = false
            }
        }
    }
}

configure(modProjects.findAll { it.path != ':vendor:yyzsbackpack' }) {
    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.nucleoid.xyz/' }
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
    }

    base {
        archivesName = project.name
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }

    processResources {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') {
            expand 'version': project.version
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 21
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    if (optionalAddonQa.get()
            && project.path != ':dev'
            && project.path != ':tests:gametest') {
        def optionalQaCase = project.path.substring(1).replace(':', '-')
        def optionalQaRunDir = project.relativePath(
                rootProject.file("build/qa/optional-addon/${optionalQaCase}"))
        loom {
            runs {
                server {
                    runDir = optionalQaRunDir
                }
            }
        }
    }

    if (project.path != ':dev') {
        tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
            enabled = optionalAddonQa.get() && it.name == 'runServer'
        }
    }
}

gradle.projectsEvaluated {
    modProjects.findAll { it.path != ':dev' }.each { modProject ->
        modProject.tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
            if (!enabled) {
                // Gradle's unqualified runServer/runClient task selectors also
                // select same-named Loom tasks in subprojects. Disabled tasks
                // still execute dependencies unless Loom's late-added edges
                // are removed after every project has been evaluated.
                setDependsOn([])
                classpath = modProject.files()
            }
        }
    }
}

configure(modProjects.findAll { it.path.startsWith(':addons:') }) {
