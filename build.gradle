}

def verifyNoRemovedGovernmentFormsTask = tasks.register('verifyNoRemovedGovernmentForms') {
    group = 'verification'
    description = 'Fails if removed Government form configs are present in dev or GameTest config roots.'
    doLast {
        def removedFormIds = ['confederation', 'council', 'theocracy'] as Set
        def scanRoots = [
                layout.projectDirectory.dir('dev/run').asFile,
                layout.projectDirectory.dir('tests/gametest/run').asFile
        ].findAll { it.exists() }
        def stale = []
        scanRoots.each { root ->
            fileTree(root) {
                include '**/config/elarion/addons/government/forms/*/form.yml'
            }.files.each { file ->
                def formId = file.parentFile.name
                if (removedFormIds.contains(formId)) {
                    stale << rootProject.projectDir.toPath().relativize(file.toPath()).toString()
                }
            }
        }
        if (!stale.isEmpty()) {
            throw new GradleException('Removed Government form config files must not be packaged or uploaded:\n'
                    + stale.sort().collect { " - ${it}" }.join('\n'))
        }
    }
}

subprojects {
    tasks.matching { it.name == 'build' }.configureEach {
        dependsOn verifyNoRemovedGovernmentFormsTask
    }
}

