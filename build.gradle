def verifyDistributionManifestTask = tasks.register('verifyDistributionManifest') {
    group = 'verification'
    description = 'Validates the canonical pinned third-party distribution manifest.'
    dependsOn verifyExcaliburedCitTask
    inputs.file(distributionManifestFile)
    inputs.files(fileTree('distribution/client') { include '**/*' })
    inputs.files(fileTree('distribution/server') { include '**/*' })
    doLast {
        if (distributionManifest.schemaVersion != 1
                || distributionManifest.minecraft != minecraft_version
                || distributionManifest.fabricLoader != loader_version) {
            throw new GradleException('distribution/mods.json does not match the configured Minecraft/Fabric release.')
        }
        def duplicateIds = distributionArtifacts.groupBy { it.id }.findAll { it.value.size() > 1 }.keySet()
        def duplicateFiles = distributionArtifacts.groupBy { it.filename }.findAll { it.value.size() > 1 }.keySet()
        if (!duplicateIds.isEmpty() || !duplicateFiles.isEmpty()) {
            throw new GradleException("Duplicate distribution ids=${duplicateIds} files=${duplicateFiles}")
        }
        distributionArtifacts.each { artifact ->
            if (!(artifact.side in ['both', 'server', 'client', 'admin'])) {
                throw new GradleException("Unsupported side '${artifact.side}' for ${artifact.id}")
            }
            if (!artifact.coordinate || !artifact.filename || !artifact.url || !artifact.source || !artifact.license) {
                throw new GradleException("Incomplete distribution metadata for ${artifact.id}")
            }
            if (!(artifact.sha512 ==~ /[0-9a-f]{128}/)) {
                throw new GradleException("Invalid SHA-512 for ${artifact.id}")
            }
        }
        def managedClient = fileTree('distribution/client/managed') { include '**/*' }.files
        def defaultClient = fileTree('distribution/client/defaults') { include '**/*' }.files
        if (managedClient.isEmpty() || defaultClient.isEmpty()) {
            throw new GradleException('Client managed safety settings and non-destructive defaults are both required.')
        }
        def requiredServerConfigs = [
                'config/fabric_loader_dependencies.json',
                'config/lithium.properties',
                'config/modernfix-mixins.properties'
        ]
        def missingServerConfigs = requiredServerConfigs.findAll {
            !file("distribution/server/managed/${it}").isFile()
        }
        if (!missingServerConfigs.isEmpty()) {
            throw new GradleException('Missing managed server safety configs: ' + missingServerConfigs)
        }
    }
}

def exportModsTask = tasks.register('exportMods', Sync) {
    group = 'distribution'
    description = 'Builds install-ready client and server roots with mods, configs, resources, and launcher manifests.'
    dependsOn verifyDistributionManifestTask
    into layout.buildDirectory.dir('export')
    duplicatesStrategy = DuplicatesStrategy.FAIL

    exportableModProjects.each { modProject ->
        def remapJar = modProject.tasks.named('remapJar')
        dependsOn remapJar
        from(remapJar.flatMap { it.archiveFile }) {
            into 'server/mods'
        }
        from(remapJar.flatMap { it.archiveFile }) {
            into 'client/mods'
        }
    }

    from(configurations.distributionBoth) {
        into 'server/mods'
        rename { canonicalThirdPartyJarName(it) }
    }
    from(configurations.distributionBoth) {
        into 'client/mods'
        rename { canonicalThirdPartyJarName(it) }
    }
    from(configurations.distributionServer) {
        into 'server/mods'
        rename { canonicalThirdPartyJarName(it) }
    }
    from(configurations.distributionClient) {
        into 'client/mods'
        rename { canonicalThirdPartyJarName(it) }
    }
    from(configurations.distributionAdmin) {
        into 'server/mods'
        rename { canonicalThirdPartyJarName(it) }
    }
    from('distribution/server/managed') { into 'server' }
    from('distribution/client/defaults') { into 'client' }
    from('distribution/client/managed') { into 'client' }
    from('dev/resourcepacks') {
        include '*.zip'
        into 'client/resourcepacks'
    }

    doLast {
        def exportRoot = layout.buildDirectory.dir('export').get().asFile
        def managedPaths = [
                server: fileTree('distribution/server/managed').files.collect {
                    file('distribution/server/managed').toPath().relativize(it.toPath()).toString().replace('\\', '/')
                } as Set,
                client: fileTree('distribution/client/managed').files.collect {
                    file('distribution/client/managed').toPath().relativize(it.toPath()).toString().replace('\\', '/')
                } as Set
        ]
        ['server', 'client'].each { side ->
            def sideRoot = new File(exportRoot, side)
            def expectedArtifacts = distributionArtifacts.findAll {
                it.side == 'both' || it.side == side || (side == 'server' && it.side == 'admin')
            }
            expectedArtifacts.each { artifact ->
                def jar = new File(sideRoot, "mods/${artifact.filename}")
                if (!jar.isFile()) throw new GradleException("Missing exported artifact ${side}/${artifact.filename}")
                def actualHash = sha512(jar)
                if (actualHash != artifact.sha512) {
                    throw new GradleException("SHA-512 mismatch for ${side}/${artifact.filename}")
                }
            }

            def files = fileTree(sideRoot).files.findAll { it.isFile() && it.name != 'manifest.json' }.collect { exportedFile ->
                def relative = sideRoot.toPath().relativize(exportedFile.toPath()).toString().replace('\\', '/')
                def artifact = relative.startsWith('mods/')
                        ? distributionArtifactsByFilename[exportedFile.name]
                        : null
                def bundledArtifact = relative.startsWith('mods/')
                        ? bundledArtifactMetadata[exportedFile.name]
                        : null
                def internalJar = relative.startsWith('mods/') && artifact == null
                [
                        path: relative,
                        side: side,
                        role: artifact?.role ?: bundledArtifact?.role ?: (internalJar ? 'elarion-mod' :
                                (relative.startsWith('resourcepacks/') ? 'resource-pack' :
                                        ((relative.startsWith('config/') || managedPaths[side].contains(relative))
                                                ? 'config' : 'content'))),
                        size: exportedFile.length(),
                        sha512: sha512(exportedFile),
                        source: artifact?.source ?: bundledArtifact?.source ?: 'elarion-release-bundle',
                        license: artifact?.license ?: bundledArtifact?.license ?:
                                (internalJar ? 'Elarion project license' : 'Elarion configuration/content'),
                        url: artifact?.url,
                        projectId: artifact?.projectId,
                        versionId: artifact?.versionId,
                        updateMode: managedPaths[side].contains(relative)
                                ? 'always-replace'
                                : (relative.startsWith('config/') ? 'if-absent' : 'required-exact'),
                        delivery: artifact ? 'official-download' : 'release-bundle'
                ]
            }.sort { it.path }
            def launcherManifest = [
                    schemaVersion: 1,
                    release: project.version.toString(),
                    minecraft: minecraft_version,
                    fabricLoader: loader_version,
                    side: side,
                    generatedAt: java.time.Instant.now().toString(),
                    java: [
                            requiredMajorVersion: 21,
                            recommendedMaxHeapMiB: side == 'client' ? 6144 : 4096,
                            jvmArgs: side == 'client'
                                    ? ['-XX:+UseZGC', '-XX:+ZGenerational']
                                    : []
                    ],
                    files: files
            ]
            new File(sideRoot, 'manifest.json').setText(
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launcherManifest)) + '\n', 'UTF-8')
        }
    }
}

exportModsTask.configure {
    mustRunAfter cleanExportModsTask
}

tasks.register('syncDevRuntimeMods') {
    group = 'fabric'
    description = 'Synchronizes canonical third-party mods, managed safety configs, defaults, and resource packs into IntelliJ/Loom runs.'
    dependsOn verifyDistributionManifestTask
    dependsOn ':vendor:yyzsbackpack:remapJar'
    inputs.files(configurations.distributionBoth)
    inputs.files(configurations.distributionServer)
    inputs.files(configurations.distributionClient)
    inputs.files(configurations.distributionAdmin)
    inputs.files(bundledRuntimeJarFiles)
    inputs.files(fileTree('dev/resourcepacks') { include '*.zip' })
    inputs.files(fileTree('distribution/client') { include '**/*' })
    inputs.files(fileTree('distribution/server') { include '**/*' })
    outputs.dirs(
            layout.projectDirectory.dir('dev/run/mods'),
            layout.projectDirectory.dir('dev/run/client-generic/mods'),
            layout.projectDirectory.dir('dev/run/client-one/mods'),
            layout.projectDirectory.dir('dev/run/client-two/mods'),
            layout.projectDirectory.dir('dev/run/client-generic/resourcepacks'),
            layout.projectDirectory.dir('dev/run/client-one/resourcepacks'),
            layout.projectDirectory.dir('dev/run/client-two/resourcepacks')
    )
    outputs.file(layout.projectDirectory.file('dev/run/config/fabric_loader_dependencies.json'))
    outputs.file(layout.projectDirectory.file('dev/run/config/lithium.properties'))
    outputs.file(layout.projectDirectory.file('dev/run/config/modernfix-mixins.properties'))
    outputs.upToDateWhen { false }
    doLast {
        def serverRoot = layout.projectDirectory.dir('dev/run').asFile
        def serverMods = new File(serverRoot, 'mods')
        def serverConfig = new File(serverRoot, 'config')
        enforceDevOfflineAuthentication(new File(serverRoot, 'server.properties'))
        def clientModDirs = [
                layout.projectDirectory.dir('dev/run/client-generic/mods').asFile,
                layout.projectDirectory.dir('dev/run/client-one/mods').asFile,
                layout.projectDirectory.dir('dev/run/client-two/mods').asFile
        ]
        def adminClientModDir = layout.projectDirectory.dir('dev/run/client-one/mods').asFile
        def sharedResourcePacks = layout.projectDirectory.dir('dev/resourcepacks').asFile
        def clientResourcePackDirs = [
                layout.projectDirectory.dir('dev/run/client-generic/resourcepacks').asFile,
                layout.projectDirectory.dir('dev/run/client-one/resourcepacks').asFile,
                layout.projectDirectory.dir('dev/run/client-two/resourcepacks').asFile
        ]
        def legacyManaged = (distributionArtifacts*.filename + bundledArtifactMetadata.keySet() + [
                'modmenu-11.0.3.jar',
                'iris-fabric-1.8.8+mc1.21.1.jar'
        ]) as Set
        def readManagedMarker = { File marker ->
            if (!marker.isFile()) return [] as Set
            try {
                def parsed = new groovy.json.JsonSlurper().parse(marker)
                if (!(parsed instanceof List) || !parsed.every { it instanceof String }) {
                    throw new GradleException('Expected a JSON array of artifact filenames')
                }
                return parsed as Set
            } catch (Exception exception) {
                logger.warn("Ignoring unreadable local managed-mod marker {} ({})", marker,
                        exception.class.simpleName)
                return [] as Set
            }
        }
        def serverArtifactNames = distributionArtifacts.findAll {
            it.side in ['both', 'server', 'admin']
        }*.filename as Set
        serverArtifactNames.addAll(bundledArtifactMetadata.keySet())
        serverMods.mkdirs()
        def serverMarker = new File(serverMods, '.elarion-managed-mods.json')
        def previousServer = readManagedMarker(serverMarker)
        (previousServer + legacyManaged).each { name ->
            def candidate = new File(serverMods, name)
            if (candidate.isFile()) candidate.delete()
        }
        copy {
            from configurations.distributionBoth
            from configurations.distributionServer
            from configurations.distributionAdmin
            from bundledRuntimeJarFiles
            rename { canonicalThirdPartyJarName(it) }
            into serverMods
        }
        serverMarker.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(serverArtifactNames.sort())) + '\n', 'UTF-8')
        def legacyNestedServerConfig = new File(serverConfig, 'config')
        ['fabric_loader_dependencies.json', 'lithium.properties', 'modernfix-mixins.properties'].each { name ->
            def staleManagedFile = new File(legacyNestedServerConfig, name)
            if (staleManagedFile.isFile()) staleManagedFile.delete()
        }
        if (legacyNestedServerConfig.isDirectory()
                && (legacyNestedServerConfig.listFiles() ?: []).length == 0) {
            legacyNestedServerConfig.delete()
        }
        copy { from 'distribution/server/managed'; into serverRoot }
        clientModDirs.each { clientModDir ->
            def expected = distributionArtifacts.findAll { it.side in ['both', 'client'] }*.filename as Set
            expected.addAll(bundledArtifactMetadata.keySet())
            def marker = new File(clientModDir, '.elarion-managed-mods.json')
            def previous = readManagedMarker(marker)
            (previous + legacyManaged).each { name ->
                def candidate = new File(clientModDir, name)
                if (candidate.isFile()) candidate.delete()
            }
            copy {
                from configurations.distributionBoth
                from configurations.distributionClient
                from bundledRuntimeJarFiles
                rename { canonicalThirdPartyJarName(it) }
                into clientModDir
            }
            marker.setText(groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(expected.sort())) + '\n', 'UTF-8')
        }
        copy {
            from configurations.distributionAdmin
            rename { canonicalThirdPartyJarName(it) }
            into adminClientModDir
        }
        def adminMarker = new File(adminClientModDir, '.elarion-managed-mods.json')
        def adminNames = (distributionArtifacts.findAll {
            it.side in ['both', 'client', 'admin']
        }*.filename + bundledArtifactMetadata.keySet()).sort()
        adminMarker.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(adminNames)) + '\n', 'UTF-8')
        clientModDirs.each { clientModDir ->
            def clientRoot = clientModDir.parentFile
            copy { from 'distribution/client/managed'; into clientRoot }
            copy { from 'distribution/client/defaults'; into clientRoot }
            def yosbrRoot = new File(clientRoot, 'config/yosbr')
            def defaultOptions = new File(yosbrRoot, 'options.txt')
            def liveOptions = new File(clientRoot, 'options.txt')
            if (!liveOptions.isFile() && defaultOptions.isFile()) {
                liveOptions.parentFile.mkdirs()
                java.nio.file.Files.copy(defaultOptions.toPath(), liveOptions.toPath())
            }
            def yosbrConfig = new File(yosbrRoot, 'config')
            if (yosbrConfig.isDirectory()) {
                fileTree(yosbrConfig).files.each { defaultFile ->
                    def relative = yosbrConfig.toPath().relativize(defaultFile.toPath())
                    def liveFile = new File(new File(clientRoot, 'config'), relative.toString())
                    if (!liveFile.isFile()) {
                        liveFile.parentFile.mkdirs()
                        java.nio.file.Files.copy(defaultFile.toPath(), liveFile.toPath())
                    }
                }
            }
        }
        if (sharedResourcePacks.isDirectory()) {
            def sharedPackNames = sharedResourcePacks.listFiles()
                    .findAll { it.isFile() && it.name.toLowerCase(Locale.ROOT).endsWith('.zip') }
                    .collect { it.name }
                    .sort()
            clientResourcePackDirs.each { clientResourcePackDir ->
                copy {
                    from sharedResourcePacks
                    into clientResourcePackDir
                }
                enableSharedResourcePacks(
                        new File(clientResourcePackDir.parentFile, 'options.txt'),
                        sharedPackNames)
            }
        }
    }
}

tasks.register('syncDevClientMods') {
    group = 'fabric'
    description = 'Compatibility alias for syncDevRuntimeMods.'
    dependsOn 'syncDevRuntimeMods'
}

// Direct IntelliJ task launches must be self-sufficient too. Dependencies have
// no implicit sibling order, so Loom may not scan a client/server directory
// while syncDevRuntimeMods is replacing its managed jars.
gradle.projectsEvaluated {
    def runtimeSync = tasks.named('syncDevRuntimeMods')
    ['runClient', 'runClientOne', 'runClientTwo', 'runServer'].each { taskName ->
        project(':dev').tasks.named(taskName).configure {
            dependsOn(runtimeSync)
            mustRunAfter(runtimeSync)
        }
    }
}

tasks.register('cleanDevRunLocks', Delete) {
    group = 'fabric'
    description = 'Deletes dev-run Fabric remap cache and active log files after all dev server/client processes are stopped.'
    delete layout.projectDirectory.dir('dev/run/.fabric/processedMods')
    delete layout.projectDirectory.file('dev/run/logs/latest.log')
    delete layout.projectDirectory.file('dev/run/logs/debug.log')
}

tasks.register('rebuildExportMods') {
    group = 'distribution'
    description = 'Cleans, builds, and regenerates the install-ready client and server roots.'
    dependsOn cleanExportModsTask, exportModsTask
}

tasks.register('prepareLiveServerRelease') {
    group = 'distribution'
    description = 'Runs release verification and rebuilds the exact install-ready server/client exports.'
    dependsOn modProjects.collect { it.tasks.named('build') }
    dependsOn 'verifyAiContext', verifyNoRemovedGovernmentFormsTask, 'rebuildExportMods'
}

tasks.register('deployLiveServerMods', Exec) {
    group = 'distribution'
    description = 'Stages, backs up, and promotes the verified server-mods export to the stopped live server.'
    def deploymentApproved = providers.gradleProperty('liveDeployConfirmed').orNull == 'true' &&
            providers.gradleProperty('serverStopped').orNull == 'true'
    if (deploymentApproved) {
        dependsOn 'prepareLiveServerRelease'
    }
    workingDir rootProject.projectDir
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('dev/tools/deploy-live-server.ps1'),
            '-ConfirmDeploy', '-ServerStopped'

    doFirst {
        if (!deploymentApproved) {
            throw new GradleException('Live deployment requires -PliveDeployConfirmed=true -PserverStopped=true.')
        }
    }
}
